<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background square with rounded corners -->
  <rect x="0" y="0" width="512" height="512" rx="80" ry="80" fill="url(#bg-grad)"/>

  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="78" ry="78" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.3"/>

  <!-- Shield shape -->
  <path d="M256 80 L376 130 L376 260 C376 340 256 420 256 420 C256 420 136 340 136 260 L136 130 Z"
        fill="url(#shield-grad)" opacity="0.95"/>

  <!-- Shield highlight -->
  <path d="M256 100 L360 144 L360 256 C360 328 256 400 256 400 C256 400 152 328 152 256 L152 144 Z"
        fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>

  <!-- Lock/eye icon inside shield -->
  <circle cx="256" cy="220" r="35" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="256" cy="220" r="12" fill="#ffffff"/>
  <rect x="248" y="248" width="16" height="24" rx="4" fill="#ffffff"/>

  <!-- "SENTINEL" text -->
  <text x="256" y="472" text-anchor="middle" font-family="'Inter','SF Pro Display','Helvetica Neue',sans-serif"
        font-size="36" font-weight="800" letter-spacing="6" fill="#e4e4e7">SENTINEL</text>

  <!-- "SQUARE" text below -->
  <text x="256" y="498" text-anchor="middle" font-family="'JetBrains Mono',monospace"
        font-size="16" font-weight="600" letter-spacing="8" fill="#22c55e">SQUARE</text>
</svg>
